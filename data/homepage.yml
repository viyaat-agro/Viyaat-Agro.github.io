about:
  eyebrow: "About Viyaat"
  title: "Where good farming meets sound business."
  text:
    - "Viyaat is an agriculture company working across <strong>Production</strong>, <strong>Consulting</strong> and <strong>Agri Tourism</strong>."
    - "We grow flowers and capsicum in polyhouses, combining technology-led farming with hands-on management, so farms are run with discipline and perform consistently. Today our focus is protected cultivation, where climate, water and inputs are in our hands."
  milestones:
    - value: "4 yrs"
      label: "of hands-on farming"
    - value: "140+"
      label: "acres of open-field farming in our earlier years"
    - value: "30+"
      label: "acres of polyhouse cultivation today"
  img: "assets/img/yellow-chrysanthemum.jpg"
  alt: "Freshly cut yellow chrysanthemum bouquet from a Viyaat farm"

verticals:
  eyebrow: "What we do"
  title: "Three verticals. One principle: skin in the game."
  items:
    - id: production
      number: "01"
      name: "Production"
      headline: "Polyhouse cultivation of flowers and capsicum"
      text: "We grow <strong>flowers and capsicum across 30+ acres of polyhouses</strong>. Protected cultivation gives us precise control over climate, water and inputs, which means consistent quality and dependable supply, season after season."
      lists:
        - label: "What we grow"
          items: ["Dutch roses", "Chrysanthemum", "Snapdragon", "Gypsophila", "Celosia", "Filler materials", "Capsicum"]
        - label: "Who we supply"
          items: ["Wholesalers", "Exporters", "Hospitality", "Events", "Retailers"]
      img: "assets/img/polyhouse-pepper.jpg"
      alt: "Capsicum plant on drip irrigation inside a Viyaat polyhouse, with chrysanthemum seedlings behind"
    - id: consulting
      number: "02"
      name: "Consulting"
      headline: "From underperforming farm to profitable farm"
      text: "We have consulted on <strong>50+ acres of polyhouse farms</strong>. For each farmer we set up a sound package of practices, built the supply chain to take their produce to market, and kept the focus on profitability."
      extra: "Our plug-and-play model covers everything, from setup to day-to-day running, and we also turn underperforming farms around. We work in the structure that suits the farm: <strong>revenue share, equity or an operating partnership</strong>. We don't just advise. <strong>We have skin in the game</strong>, so our success is tied to yours."
      lists:
        - label: "What farmers get"
          items: ["Package of practices", "Supply chains", "Profitability"]
        - label: "How we work with you"
          items: ["Revenue share", "Equity", "Operating partnership"]
      img: "assets/img/rose-harvest-baskets.jpg"
      alt: "Freshly harvested rose buds in protective sleeves, collected in baskets on a Viyaat farm"
    - id: agritourism
      number: "03"
      name: "Agri Tourism"
      headline: "Experience the farm"
      text: "Agriculture is something people want to see for themselves. Our working farms are open to visitors, such as families, school groups and corporate teams. They can walk through polyhouses, see how flowers and produce are grown, take part in farm activities and connect with where food comes from."
      lists:
        - label: "Who visits"
          items: ["Families", "School groups", "Corporate teams"]
      img: "assets/img/polyhouse-rows.jpg"
      alt: "Rows of capsicum trained on strings inside a Viyaat polyhouse"
      ratio: "wide"

why:
  eyebrow: "Why protected cultivation"
  title: "Polyhouse farming: higher yields and climate resilience."
  technology:
    - name: "Structure & covering"
      text: "UV poly film over a steel frame; sealed and controllable."
    - name: "Climate control"
      text: "Fan-pad or natural ventilation regulates temperature and humidity."
    - name: "Drip irrigation + fertigation"
      text: "Precise root-zone delivery of water and nutrients."
    - name: "Round-the-year production"
      text: "3–4 crop cycles annually vs 1–2 in the open."
  benefits:
    - { value: "8–10x", label: "Higher yield" }
    - { value: "60–70%", label: "Water saved" }
    - { value: "₹15–20L", label: "Net income per acre per year" }
    - { value: "35–50%", label: "Government subsidy" }
  rows:
    - factor: "Environmental friendliness"
      polyhouse: "60–70% less water and 30–40% less fertilizer via drip fertigation; minimal runoff."
      open: "Higher water and fertilizer use; greater runoff and chemical exposure."
    - factor: "Climate resilience"
      polyhouse: "Shielded from hail, excess rain and temperature swings; crop loss under 10%."
      open: "Fully exposed to weather; losses often 25–35% of yield."
    - factor: "Crops"
      polyhouse: "High-value: capsicum, tomato, cucumber, strawberry, cut flowers (rose, gerbera, orchid)."
      open: "Staples and bulk crops: wheat, rice, pulses, oilseeds, cotton."
    - factor: "Economic output"
      polyhouse: "Net income ₹15–20 lakh/acre; B:C ratio up to 3.6."
      open: "Net income typically ₹2–4 lakh/ha."
    - factor: "Labour efficiency"
      polyhouse: "Automated fertigation and climate control cut manual labour by 7–18%."
      open: "Labour-intensive irrigation, weeding and pest control."
    - factor: "Premium products"
      polyhouse: "Export-quality, off-season and festival-timed produce commands price premiums."
      open: "Seasonal glut and inconsistent quality limit premium and export access."
  note: "Indicative industry figures; actual results vary by crop, site and management."

