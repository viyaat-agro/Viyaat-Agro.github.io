hero:
  eyebrow: "Polyhouse flowers & capsicum · Farm consulting · Agri tourism"
  title: "Cultivating hope. Feeding the world. Redefining agriculture."
  lead: "Flowers and capsicum grown in polyhouses, farm turnaround consulting, and agri tourism, all backed by our own capital and effort."
  primary:
    text: "Explore what we do"
    url: "#verticals"
  secondary:
    text: "Get in touch"
    url: "#contact"
  stats:
    - value: "30+"
      label: "acres of polyhouse cultivation"
    - value: "50+"
      label: "acres of polyhouse farms consulted"
    - value: "3"
      label: "verticals"

about:
  eyebrow: "About Viyaat"
  title: "Farms that run well, and make money."
  text:
    - "Viyaat is an agriculture company working across <strong>Production</strong>, <strong>Consulting</strong> and <strong>Agri Tourism</strong>."
    - "We grow flowers and capsicum in polyhouses, combining technology-led farming with hands-on management, so farms run well and make money. Today our focus is protected cultivation, where climate, water and inputs are in our hands."
  milestones:
    - value: "4 yrs"
      label: "of hands-on farming"
    - value: "140+"
      label: "acres of open-field farming in our earlier years"
    - value: "30+"
      label: "acres of polyhouse cultivation today"
  img: "assets/img/yellow-chrysanthemum.jpg"
  alt: "Freshly cut yellow chrysanthemum bouquet from a Viyaat farm"

verticals:
  eyebrow: "What we do"
  title: "Three verticals. One principle: skin in the game."
  items:
    - id: production
      number: "01"
      name: "Production"
      headline: "Polyhouse cultivation of flowers and capsicum"
      text: "We grow <strong>flowers and capsicum across 30+ acres of polyhouses</strong>. Protected cultivation gives us precise control over climate, water and inputs, which means consistent quality and dependable supply, season after season."
      lists:
        - label: "What we grow"
          items: ["Dutch roses", "Chrysanthemum", "Snapdragon", "Gypsophila", "Capsicum"]
        - label: "Who we supply"
          items: ["Wholesalers", "Exporters", "Hospitality", "Events", "Retailers"]
      img: "assets/img/polyhouse-pepper.jpg"
      alt: "Capsicum plant on drip irrigation inside a Viyaat polyhouse, with chrysanthemum seedlings behind"
    - id: consulting
      number: "02"
      name: "Consulting"
      headline: "From underperforming farm to profitable farm"
      text: "We have consulted on <strong>50+ acres of polyhouse farms</strong>. For each farmer we set up a sound package of practices, built the supply chain to take their produce to market, and kept the focus on profitability."
      extra: "Our plug-and-play model covers everything, from setup to day-to-day running, and we also turn underperforming farms around. We work in the structure that suits the farm: <strong>revenue share, equity or an operating partnership</strong>. We don't just advise. <strong>We have skin in the game</strong>, so our success is tied to yours."
      lists:
        - label: "What farmers get"
          items: ["Package of practices", "Supply chains", "Profitability"]
        - label: "How we work with you"
          items: ["Revenue share", "Equity", "Operating partnership"]
      img: "assets/img/rose-harvest-baskets.jpg"
      alt: "Freshly harvested rose buds in protective sleeves, collected in baskets on a Viyaat farm"
    - id: agritourism
      number: "03"
      name: "Agri Tourism"
      headline: "Experience the farm"
      text: "Agriculture is something people want to see for themselves. Our working farms are open to visitors, such as families, school groups, corporate teams and city dwellers. They can walk through polyhouses, see how flowers and produce are grown, take part in farm activities and connect with where food comes from."
      lists:
        - label: "Who visits"
          items: ["Families", "School groups", "Corporate teams", "City dwellers"]
      img: "assets/img/polyhouse-rows.jpg"
      alt: "Rows of capsicum trained on strings inside a Viyaat polyhouse"
      ratio: "wide"

