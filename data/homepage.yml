    - { img: "assets/img/pink-chrysanthemum-bunch.jpg", alt: "Wrapped bunch of pink and white chrysanthemum", w: 960, h: 1280 }
    - { img: "assets/img/rose-buds-basket.jpg", alt: "Rose buds in protective sleeves in a green harvest basket", w: 960, h: 1280 }
    - { img: "assets/img/gypsophila.jpg", alt: "Fresh gypsophila", w: 960, h: 1280 }
    - { img: "assets/img/pink-chrysanthemum-heap.jpg", alt: "Freshly cut pink chrysanthemum stems", w: 1280, h: 960 }
